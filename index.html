<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="卡间拾光，收藏一方卡面里的万千风景。浏览银行卡设计，按银行、卡片类型与卡组织筛选你喜欢的卡面。">
  <title>卡间拾光 · 银行卡收藏画廊</title>
  <link rel="icon" type="image/svg+xml" href="./assets/card-mark.svg">
  <link rel="stylesheet" href="./styles.css">
  <script src="./cards.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#gallery">跳转到卡片画廊</a>
  <main class="main-content">
    <header class="page-heading">
      <div>
        <p class="panel-label">银行卡收藏画廊</p>
        <h1><a class="brand" href="./index.html" aria-label="卡间拾光首页">卡间<span class="brand-emphasis">拾光</span></a></h1>
        <p class="page-description">收集卡面，也留住与它们有关的片刻。</p>
      </div>
      <span class="gallery-hint">点击卡片，立体查看 <span aria-hidden="true">↗</span></span>
    </header>
    <section class="filters" aria-label="筛选卡片" hidden>
      <form class="search" role="search" id="search-form">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg>
        <input id="search-input" type="search" placeholder="搜索银行、卡名或卡组织" aria-label="搜索银行、卡名或卡组织" aria-keyshortcuts="/" autocomplete="off">
        <kbd class="search-shortcut" aria-hidden="true">/</kbd>
        <button class="clear-search" id="clear-search" type="button" aria-label="清除搜索" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M7 17 17 7"/></svg></button>
      </form>
      <div class="filter-controls">
        <div class="type-filters" role="group" aria-label="卡片类型">
          <button class="type-button is-active" type="button" data-type="all" aria-pressed="true">全部 <span class="count" id="count-all">0</span></button>
          <button class="type-button" type="button" data-type="debit" aria-pressed="false">储蓄卡 <span class="count" id="count-debit">0</span></button>
          <button class="type-button" type="button" data-type="credit" aria-pressed="false">信用卡 <span class="count" id="count-credit">0</span></button>
        </div>
        <button class="picker-trigger" id="bank-trigger" type="button" aria-label="按银行筛选：全部银行" aria-haspopup="listbox" aria-expanded="false" aria-controls="bank-options">
          <span class="picker-icon" id="bank-picker-icon" aria-hidden="true"></span>
          <span class="picker-label" id="bank-picker-label">全部银行</span>
          <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg>
        </button>
        <button class="picker-trigger" id="network-trigger" type="button" aria-label="按卡组织筛选：全部卡组织" aria-haspopup="listbox" aria-expanded="false" aria-controls="network-options">
          <span class="picker-icon" id="network-picker-icon" aria-hidden="true"></span>
          <span class="picker-label" id="network-picker-label">全部卡组织</span>
          <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg>
        </button>
      </div>
    </section>
    <div class="picker-menu bank-picker-menu" id="bank-options" role="listbox" aria-label="选择银行" popover="manual" hidden></div>
    <div class="picker-menu" id="network-options" role="listbox" aria-label="选择卡组织" popover="manual" hidden></div>
    <div class="results-note" hidden><p id="results-text"></p><button class="text-button" id="reset-filters" type="button" hidden>重置筛选 <span aria-hidden="true">↺</span></button></div>
    <p id="live-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    <section class="data-status" id="data-status" role="alert" hidden>
      <h2>卡片资料加载失败</h2>
      <p id="data-message"></p>
      <a class="primary-button" href="./index.html">重新加载</a>
    </section>
    <section class="gallery" id="gallery" aria-label="卡片收藏" tabindex="-1" hidden></section>
    <section class="empty-state" id="empty-state" hidden>
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="7" y="14" width="45" height="32" rx="7"/><path d="M8 25h43M16 36h8"/><circle cx="46" cy="44" r="10"/><path d="m53 51 7 7"/></svg>
      <h2>还没有找到这张卡</h2>
      <p>换个搜索词，或调整筛选条件。</p>
      <button class="primary-button" id="empty-reset" type="button">查看全部卡片</button>
    </section>
    <noscript><p class="no-script">请开启 JavaScript 以浏览卡片和使用筛选功能。</p></noscript>
  </main>
  <footer class="site-footer"><p>卡间拾光 · 银行卡收藏画廊</p></footer>
  <dialog id="card-dialog" class="card-dialog" aria-labelledby="detail-title">
    <div class="dialog-toolbar">
      <div class="detail-navigation" aria-label="浏览筛选结果中的卡片">
        <button class="icon-button" id="previous-card" type="button" aria-label="上一张卡片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
        <span id="detail-position" aria-live="polite"></span>
        <button class="icon-button" id="next-card" type="button" aria-label="下一张卡片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
      </div>
      <button class="icon-button dialog-close" id="close-dialog" type="button" aria-label="关闭卡面详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </div>
    <div class="dialog-content">
      <div class="detail-information">
        <div><h2 id="detail-title"></h2><div class="detail-meta"><span id="detail-bank" class="detail-bank"></span><span class="detail-type" id="detail-type"></span></div></div>
        <p id="detail-asset-note" class="detail-asset-note"></p>
      </div>
      <div class="card-view-options" id="card-view-options" role="group" aria-label="卡面版本" hidden>
        <button type="button" data-card-view="hd" aria-pressed="true">高清卡面</button>
        <button type="button" data-card-view="clean" aria-pressed="false">纯底图</button>
        <button type="button" data-card-view="layers" aria-pressed="false">分层展示</button>
        <button type="button" data-card-view="original" aria-pressed="false">原始卡面</button>
      </div>
      <div class="detail-workspace">
        <div class="detail-stage-column">
          <div class="detail-visual" id="detail-visual">
            <div id="detail-viewer" class="card-viewer-stage" tabindex="0" role="img" aria-label="银行卡三维预览，拖动环绕查看" aria-busy="false" hidden></div>
            <p id="detail-viewer-status" class="viewer-status" role="status" hidden></p>
          </div>
          <div class="viewer-controls" id="detail-viewer-controls" hidden>
            <div class="viewer-toolbar">
              <div class="viewer-finishes" role="group" aria-label="卡片表面材质">
                <button type="button" data-finish="original" aria-pressed="true">原色</button>
                <button type="button" data-finish="matte" aria-pressed="false">哑光</button>
                <button type="button" data-finish="gloss" aria-pressed="false">覆膜</button>
                <button type="button" data-finish="iridescent" aria-pressed="false">虹彩</button>
              </div>
              <div class="viewer-actions">
                <button type="button" id="viewer-background" aria-pressed="false">深色背景</button>
                <button type="button" id="viewer-flip">查看另一面</button>
                <button type="button" id="viewer-reset">复位</button>
              </div>
            </div>
            <p class="viewer-help" id="viewer-help">拖动或用方向键 360° 环绕 · Home 复位</p>
          </div>
          <div class="detail-filebar"><span id="detail-view-name"></span><a id="download-current" class="text-button" download>下载当前卡面 <span aria-hidden="true">↓</span></a></div>
          <div class="studio-downloads" id="studio-downloads" hidden>
            <a id="download-hd" download>高清卡面</a><a id="download-clean" download>纯底图</a><a id="download-coordinates" download>图层坐标 JSON</a>
          </div>
          <p class="studio-description" id="studio-description" hidden>素材含 AI 重绘与图案补全，可切换原始卡面对照。</p>
        </div>
        <aside id="studio-panel" class="studio-panel" aria-label="卡面图层" hidden>
          <div class="studio-panel-heading"><h3>卡面图层 <span id="layer-count"></span></h3><div><button type="button" data-layers-visible="true">全显</button><button type="button" data-layers-visible="false">全隐</button></div></div>
          <label class="layer-spacing-label" for="layer-spacing">分离距离 <output id="layer-spacing-value" for="layer-spacing">55%</output></label>
          <input id="layer-spacing" type="range" min="0" max="100" value="55" aria-label="图层分离距离">
          <div id="layer-map" class="layer-map" aria-label="元素位置图"></div>
          <ul id="layer-list" class="layer-list"></ul>
          <div id="selected-layer" class="selected-layer">
            <div class="selected-layer-heading"><strong id="selected-layer-title"></strong><div class="preview-background" role="group" aria-label="透明图层预览底色"><button type="button" data-preview-background="light" aria-pressed="true">浅底</button><button type="button" data-preview-background="dark" aria-pressed="false">深底</button></div></div>
            <div class="selected-layer-art transparency"><img id="selected-layer-preview" alt=""></div>
            <p id="selected-layer-text"></p>
            <p id="selected-layer-position" class="layer-position"></p>
            <p class="layer-coordinate-help">以高清卡面左上角为坐标原点</p>
            <a id="selected-layer-download" class="text-button" download>下载透明图层 PNG <span aria-hidden="true">↓</span></a>
          </div>
        </aside>
      </div>
    </div>
  </dialog>
</body>
</html>
