# 卡片资料：日常只编辑这个文件，排列顺序就是网页展示顺序。
# 每张卡以「- 名称:」开头，其余字段前面保留两个空格，不要用 Tab。
# 类型填写「信用卡」或「储蓄卡」；图片填写可直接访问的远端图片地址。
# 卡组织只有一个时直接填写；多个时像下面一样分行列出。
# 银行图标按银行名称自动匹配，不需要逐张填写。
# 编号可以省略，由构建自动生成；复制已有卡片时请修改或删除编号。
# PR 的 CI 会自动下载卡面到 assets/cards/，并将图片地址改为本地路径。
# 来源为 Hibank 的条目来自第三方图鉴：https://hi.zzz.moe/face。

