name: 自动整理 PR 卡面

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - cards.yaml
      - 'assets/cards/**'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: localize-card-images-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      # 不 checkout PR 分支：有写权限的任务只运行默认分支中的脚本。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v6

      - name: 安装默认分支的依赖
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 下载卡面、清理未引用图片并追加提交
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const script = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/localize-pr-cards.mjs`);
            const { localizePullRequest } = await import(script.href);
            await localizePullRequest({ github, context, core });
